[project]
name = "grounded-segment-inpaint"
version = "0.1.0"
description = "Detect objects with text prompts, segment with SAM, and inpaint background"
requires-python = ">=3.10,<3.13"
dependencies = [
    # SAM3 (Meta official package)
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    "einops",
    "huggingface_hub",

    # Inpainting (pins pillow==9.5.0)
    "iopaint>=1.2.0",

    # Utilities
    "numpy<2.0",
    "opencv-python>=4.8.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
grounded-segment = "main:main"

[tool.uv]
index-strategy = "unsafe-best-match"

# Note: Install manually:
# 1. PyTorch: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# 2. Authenticate with HuggingFace and request access to facebook/sam3:
#    huggingface-cli login
