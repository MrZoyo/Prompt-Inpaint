# ============================================================
# Grounded Segment Inpaint - 自定义配置文件模板
# Custom Configuration Template
# ============================================================
#
# 使用方法 / Usage:
#   python main.py --image photo.jpg --config configs/custom_example.yml
#
# 复制此文件并根据需要修改 / Copy this file and modify as needed
# ============================================================

# ------------------------------------------------------------
# 检测提示词列表 / Detection Prompts
# ------------------------------------------------------------
# 每个提示词会独立进行检测，检测到的物体会被分割并可选地移除
# Each prompt is detected independently, objects are segmented and optionally removed
#
# 重要提示 / Important:
# - 将常遮挡其他物体的提示词放在前面（如 robot arm）
#   Put prompts that often occlude others first (e.g., robot arm)
# - 提示词越具体越好，可以包含颜色/材质等修饰词
#   More specific prompts work better, can include color/material modifiers
# - 示例: "red cup", "wooden table", "metal knife"
#
prompts:
  # 在此添加你要检测的物体 / Add objects you want to detect here
  # - "robot arm"
  # - "cup"
  # - "knife"

# ------------------------------------------------------------
# 设置 / Settings
# ------------------------------------------------------------
settings:

  # ----------------------------------------------------------
  # SAM3 阈值 / SAM3 Thresholds
  # ----------------------------------------------------------

  # 检测置信度阈值 (0.0 - 1.0)
  # Detection confidence threshold
  # - 越高越严格，减少误检但可能漏检
  # - Higher = stricter, fewer false positives but may miss objects
  # - 推荐范围: 0.3 - 0.7
  sam3_threshold: 0.5

  # Mask 二值化阈值 (0.0 - 1.0)
  # Mask binarization threshold
  # - 控制 mask 边缘的严格程度
  # - Controls mask edge tightness
  sam3_mask_threshold: 0.5

  # ----------------------------------------------------------
  # Mask 处理 / Mask Processing
  # ----------------------------------------------------------

  # Mask 去重 IoU 阈值 (0.0 - 1.0)
  # IoU threshold for mask deduplication
  # - 重叠度超过此值的 mask 会被合并（视为同一物体）
  # - Masks with IoU above this are merged (considered same object)
  # - 推荐: 0.5
  iou_threshold: 0.5

  # 小 mask 包含合并阈值 (0.0 - 1.0)
  # Containment overlap ratio for split correction
  # - small_mask 与 large_mask 的覆盖比例超过该值才考虑合并
  # - Merge only if small_mask overlap ratio exceeds this value
  # - 推荐: 0.9
  containment_overlap_ratio: 0.9

  # 轮廓重合阈值 (0.0 - 1.0)
  # Contour overlap ratio for split correction
  # - 覆盖比例满足后，轮廓重合超过该值才合并
  # - If containment passes, contour overlap must exceed this value
  # - 推荐: 0.3
  contour_overlap_ratio: 0.3

  # Inpaint 时的 Mask 膨胀像素数
  # Mask dilation pixels for inpainting
  # - 膨胀可以避免物体边缘残留
  # - Dilation helps avoid edge artifacts
  # - 推荐: 8 - 15
  mask_dilate_pixels: 12

  # ----------------------------------------------------------
  # 模型选择 / Model Selection
  # ----------------------------------------------------------

  # SAM3 模型 (HuggingFace model id 或本地路径)
  # SAM3 model (HuggingFace model id or local path)
  # - 默认 facebook/sam3 (需先在 HuggingFace 申请权限)
  # - Default: facebook/sam3 (requires HuggingFace gated access)
  sam3_model: facebook/sam3

  # ----------------------------------------------------------
  # 背景补全 / Background Inpainting
  # ----------------------------------------------------------

  # Inpaint 后端
  # Inpainting backend
  # - iopaint: 使用 LaMa 模型，效果最好（默认）
  # - opencv:  使用 OpenCV 内置方法，速度快但效果一般
  # - none:    不进行背景补全，只输出 mask
  inpaint_backend: iopaint

  # ----------------------------------------------------------
  # 调试选项 / Debug Options
  # ----------------------------------------------------------

  # 保存调试产物
  # Save debug artifacts
  # - true:  保存每步的中间结果到 debug/ 目录
  # - false: 只保存最终结果（默认）
  save_debug: false

  # ----------------------------------------------------------
  # 输出尺寸 / Output Size
  # ----------------------------------------------------------

  # 强制缩放所有保存的图片结果
  # Force resize for all saved images
  # - 不设置则保持原始尺寸
  # - When omitted, outputs keep original size
  # - 格式: [宽, 高]
  # - Format: [width, height]
  # 示例 / Example: [448, 448]
  output_size: [448, 448]

  # ----------------------------------------------------------
  # 设备 / Device
  # ----------------------------------------------------------

  # 运行设备
  # - cuda: 使用 GPU（推荐）
  # - cpu:  使用 CPU（较慢）
  device: cuda
